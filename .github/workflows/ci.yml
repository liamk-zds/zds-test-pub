# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "dev" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"

  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2' # google-github-actions/auth
        with:
          project_id: 'zdsdatamatch00'
          workload_identity_provider: 'projects/427954152403/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: 'sv-git@zdsdatamatch00.iam.gserviceaccount.com'

      - name: Build and Push App
        run: |
          gcloud auth configure-docker australia-southeast1-docker.pkg.dev
          docker build --tag=australia-southeast1-docker.pkg.dev/zdsdatamatch00/quickstart-docker-repo/quickstart-image:tag1 .
          docker push australia-southeast1-docker.pkg.dev/zdsdatamatch00/quickstart-docker-repo/quickstart-image:tag1